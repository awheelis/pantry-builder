services:
  - type: web
    name: pantry-builder
    env: node
    buildCommand: NODE_ENV=development npm install && NODE_ENV=development npm install --prefix client && NODE_ENV=development npm install --prefix server && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/pantry.db
    disk:
      name: pantry-db
      mountPath: /var/data
      sizeGB: 1
